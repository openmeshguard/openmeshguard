name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tag and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate stable tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -f "docs/releases/$GITHUB_REF_NAME.md"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$GITHUB_REF_NAME")"
      - name: Test release preflight
        run: python3 scripts/release/test_preflight.py
      - name: Reject a previously published tag before uploading assets
        run: python3 scripts/release/preflight.py "$GITHUB_REF_NAME"
      - name: Check scanner and contracts
        run: make build test lint schema-test
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Build, sign, and upload draft release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean --release-notes docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify downloaded archives, signatures, checksums, and version
        run: ./scripts/release/verify-download.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/downloaded-release"
      - name: Verify clean tagged Go installation
        shell: bash
        run: |
          install_dir=$(mktemp -d "$RUNNER_TEMP/go-install.XXXXXX")
          cd "$install_dir"
          GOBIN="$install_dir/bin" GOPATH="$install_dir/gopath" \
            GOMODCACHE="$install_dir/modules" GOCACHE="$install_dir/cache" \
            GOWORK=off GOPROXY=direct \
            go install "github.com/openmeshguard/openmeshguard/cmd/openmeshguard@$GITHUB_REF_NAME"
          "$install_dir/bin/openmeshguard" version > "$install_dir/version.txt"
          grep -Fx "version=$GITHUB_REF_NAME" "$install_dir/version.txt"
      - name: Create pinned disposable Kind and Istio cluster
        run: make kind-up
      - name: Verify downloaded binary against a live cluster
        shell: bash
        run: |
          "$RUNNER_TEMP/downloaded-release/bin/openmeshguard" scan \
            --kubeconfig "$PWD/.e2e/admin.kubeconfig" \
            --all-namespaces > "$RUNNER_TEMP/downloaded-release/scan.json"
          jq -e --arg version "$GITHUB_REF_NAME" \
            '.scanner.version == $version and (.workloadPostures | length > 0)' \
            "$RUNNER_TEMP/downloaded-release/scan.json"
          OPENMESHGUARD_SCHEMA_REPORT="$RUNNER_TEMP/downloaded-release/scan.json" \
            go test ./internal/output -run '^TestExternalScanOutputMatchesSchema$' -count=1
      - name: Verify acceptance and read-only proofs with default dev build
        run: make e2e
      - name: Delete disposable Kind cluster
        if: always()
        run: make kind-down
      # A failed verification leaves a draft for inspection. Publication is last.
      - name: Publish verified release
        run: gh release edit "$GITHUB_REF_NAME" --repo openmeshguard/openmeshguard --draft=false --latest
