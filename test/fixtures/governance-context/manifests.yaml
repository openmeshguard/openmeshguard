            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: active-api
  namespace: omg-governance-active
spec:
  selector:
    app: active-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
