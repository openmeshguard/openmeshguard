apiVersion: v1
kind: Namespace
metadata:
  name: omg-governance-classified
  labels:
    istio-injection: enabled
    platform.example.com/environment: production
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: omg-governance-classified
spec:
  mtls:
    mode: STRICT
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: classified-api
  namespace: omg-governance-classified
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classified-api
  template:
    metadata:
      labels:
        app: classified-api
        platform.example.com/application-id: payments-api
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: classified-api
  namespace: omg-governance-classified
spec:
  selector:
    app: classified-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
